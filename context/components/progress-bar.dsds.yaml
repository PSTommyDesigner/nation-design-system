# ProgressBar in DSDS 0.23 format https://designsystemdocspec.org
# Facts come from components/Progress/ (ProgressBar.tsx, types.ts, Progress.module.css, README.md, Progress.stories.tsx),
# docs/23-progress-bars.md, docs/research/progress-component.md, tokens/scale/progress.mjs
# and the Figma page 23 Progress Bars (read 2026-10-27)
# Levels go in this order: must, should, may, should-not, must-not
# Sections go from broad to narrow: when-to-use before how-to-use, for: all before for: agent
# The first value of every enum trait is its default

kind: component
id: progress-bar
name: ProgressBar
description: >-
  A horizontal bar that shows how far a task has got, or, with no value, that work is going on and the end is unknown.
  It is the default of the three progress components in components/Progress and matches the Figma set progress-bar
  on page 23 Progress Bars. It is used mostly in back-office systems and dashboards. It exists so every screen that
  shows progress uses the same shape, sizes and colors, and gives screen readers the same name and values.

metadata:
  owner: Nation Design System team
  updated: {date: 2026-10-27}
  tags: [feedback, progress]
  status: {status: beta}
  aliases: [progress-bar]

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: >-
          Use ProgressBar for values that are compared in a list, one bar per row, such as the progress of 20 articles.
          People judge length better than angle.
        checkedBy: manual
      - level: should
        statement: >-
          Use to show progress in almost every case. It is the default. Use a ring only when there is no room for a bar,
          and a half ring only for a gauge on a dashboard.
        alternatives:
          - to: circular-progress-bar
          - to: semi-circular-progress-bar
        checkedBy: manual
      - level: should
        statement: Use for a wait longer than 3 seconds. Over 10 seconds, keep the percentage shown.
        checkedBy: manual
      - level: should-not
        statement: Show any progress indicator for a wait shorter than 1 second. A bar that appears and goes at once makes the page feel jumpy.
        checkedBy: manual
      # NEEDS CLARIFICATION: docs/23-progress-bars.md section 4.2 says a wait of 1 to 3 seconds takes a spinner, but the system has no spinner yet (the same doc lists it as pending work). What must a screen show for a wait of 1 to 3 seconds?

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: >-
          IF how far the task has got is unknown THEN leave value out. Never pass 0 for unknown.
          0 means the task is known and has not moved yet, which is a different meaning.
        checkedBy: manual
      - level: must
        statement: >-
          Pass value and max in the same unit, such as 3 and 7 for steps. max defaults to 100. The bar and its number
          always show a percentage rounded to a whole number, and a value outside 0 to max is clamped.
        checkedBy: manual
      - level: must-not
        statement: >-
          Set a width or max-width on the bar, or add a width prop. The bar always fills its parent.
          To make it shorter, limit the parent. The old Figma bar was fixed at 320 and overflowed narrow columns.
        checkedBy: manual
      - level: must-not
        statement: >-
          Change the track or fill color, or color the bar by status, such as red for failed. There is no color axis on
          purpose and the fill is always the brand color. Say failed or done in text next to the bar.
        checkedBy: manual
      - level: must-not
        statement: >-
          Set showLabel to false and write your own number next to the bar. It would not be rounded the same way,
          so what people see and what screen readers say could differ. For other wording use valueText.
        checkedBy: manual
      - level: must-not
        statement: >-
          Change the bar thickness, gap or radius with className or style. They come from the progress tokens,
          and the thickness is tied to the Slider track by a check in tokens/scale/progress.mjs.
        checkedBy: manual
      - level: must-not
        statement: >-
          Add a size 2xl, a paused, success or error state, segments or a buffer bar.
          None of them exist in the Figma file or in code.
        checkedBy: manual
      # NEEDS CLARIFICATION: docs/23-progress-bars.md section 4.7 says other units such as 3 จาก 10 ไฟล์ may be shown, but README.md says an on-screen label other than the percentage does not exist yet and only valueText can carry it. May a screen show units other than the percentage, and how?
      # NEEDS CLARIFICATION: docs/23-progress-bars.md section 4.7 says never to show the time left, but types.ts gives เหลืออีก 2 นาที as an example of valueText. May valueText or nearby text say how much time is left?

  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - refs:
          - to: shared-a11y#text-contrast
            rel: same-as
      - refs:
          - to: shared-a11y#color-not-only
            rel: same-as
      - level: must
        statement: >-
          Always pass label, a name for the task such as ความคืบหน้าการอัปโหลด. It becomes the aria-label of the box
          with role progressbar and is not shown on screen. A progressbar with no name is read as a bare number.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
            role: WCAG 2.2 SC 4.1.2 (A)
        checkedBy: manual
      - level: must
        statement: >-
          IF the percentage alone doesn't say what is happening, such as step 3 of 7, THEN pass valueText,
          such as ขั้นที่ 3 จาก 7. It becomes aria-valuetext.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
            role: WCAG 2.2 SC 4.1.2 (A)
        checkedBy: manual
      - level: must-not
        statement: >-
          Make the on-screen number readable by screen readers, or remove its aria-hidden. The value reaches screen readers
          only through aria-valuenow and aria-valuetext, so it would be read twice.
        checkedBy: manual
      # NEEDS CLARIFICATION: docs/23-progress-bars.md section 4.10 says an indeterminate bar should set aria-valuetext to say work is going on, but ProgressBar.tsx removes aria-valuetext (and aria-valuemin and aria-valuemax) whenever value is left out. Which is right?
      # NEEDS CLARIFICATION: docs/research/progress-component.md section 8.3 suggests announcing the start and the end of a task in a polite live region outside the progressbar (WCAG 2.2 SC 4.1.3), but neither the code nor docs/23-progress-bars.md has a rule. Must screens announce start and end, and with what text?

  - kind: guidelines
    for: agent
    items:
      - level: must
        statement: IF how far the task has got is unknown THEN leave value out ELSE pass value, and max when it is not 100.
        checkedBy: assisted
      - level: must
        statement: IF the values are compared in a list THEN use ProgressBar for every row, never rings.
        checkedBy: assisted
      - level: should
        statement: >-
          IF the horizontal space is too narrow for a bar, such as a small card or a table row, THEN use CircularProgressBar.
          IF the value is a measure against a ceiling on a dashboard, such as sales against target or storage used,
          THEN use SemiCircularProgressBar. ELSE use ProgressBar.
        checkedBy: assisted
      - level: should
        statement: >-
          IF the horizontal space is so narrow that the bar would be too short with the number beside it
          THEN use labelPosition bottom ELSE keep the default right.
        checkedBy: assisted
      - level: should
        statement: >-
          IF the bar sits in a table row or a small card with little height THEN use size xs.
          IF it sits in a form or a crowded panel THEN use sm. IF it must be seen at once, such as on a page that uploads
          a large file, THEN use lg. IF it is read from a distance on a large screen THEN use xl. ELSE use md.
        checkedBy: assisted

  - kind: definitions
    for: all
    context: anatomy
    items:
      - term: Root
        definition: >-
          A div that is always 100% of the parent width. With labelPosition right it is a row, the track takes the rest of
          the width, and the gap to the number is --ntg-progress-bar-hz-gap-<size> (8 to 12). With labelPosition bottom it
          is a column, the number sits under the track at the right end, and the gap is --ntg-progress-bar-vc-gap-<size>
          (2 to 6). The vertical gap is smaller because the line height of the number already holds space.
      - term: Track
        definition: >-
          The box with role progressbar, aria-label, aria-valuemin, aria-valuemax, aria-valuenow and aria-valuetext.
          Height is --ntg-progress-bar-height-<size> (4, 6, 8, 10, 12, the same formula as the Slider track),
          corner radius --ntg-progress-bar-radius-full, color --ntg-color-background-general-tertiary.
          It clips the fill. No shadow on purpose.
      - term: Fill
        definition: >-
          Starts at the left edge. Its width is the percentage, set as an inline style because it is data, not a design value.
          Color --ntg-color-background-brand-solid. A change of value slides with --ntg-motion-duration-default and
          --ntg-motion-easing-enter, and jumps at once when the user asks for reduced motion. At 0 nothing shows.
      - term: Indeterminate fill
        definition: >-
          When value is left out, a fill 40% of the track wide slides across it in a loop of 2000ms, and the number is hidden.
          The loop has no token on purpose, because it is longer than the slowest motion token. The value lives in
          PROGRESS_MOTION.indeterminateLoopMs in types.ts and in --progress-loop in Progress.module.css, and the two must
          change together. With reduced motion the fill fills the track and fades in and out instead of standing still.
      - term: Number
        definition: >-
          Shown when showLabel is true and value is set. The percentage rounded to a whole number, such as 62%, with
          aria-hidden. Text style label/xs, label/sm, label/md, label/lg or label/xl for sizes xs to xl, color
          --ntg-color-text-general-heading, tabular digits so the bar doesn't jump between values with the same number of digits.
          It sits outside the track, and its width still changes when the number of digits changes, such as from 9% to 10%.
      - term: Rounding and limits
        definition: >-
          The percentage on screen and aria-valuenow are rounded the same way, so both groups of users get the same number.
          A max that is not a positive number falls back to 100 with a console warning in development, and never throws.

alternatives:
  - to: circular-progress-bar
  - to: semi-circular-progress-bar

refs:
  - href: ../../components/Progress/ProgressBar.tsx
    rel: source
    role: Import ProgressBar from components/Progress (the folder's default export)
  - href: ../../components/Progress/types.ts
    rel: relates-to
    role: Shared props, motion and geometry constants, and readProgress for all three progress components
  - href: ../../components/Progress/README.md
    rel: relates-to
    role: Thai README with the props table for all three progress components
  - href: ../../components/Progress/Progress.stories.tsx
    rel: demo
    role: Storybook stories (npm run storybook)
  - href: ../../docs/23-progress-bars.md
    rel: relates-to
    role: Thai page doc for Figma page 23 Progress Bars
  - href: ../../docs/research/progress-component.md
    rel: relates-to
    role: Research comparing 15 design systems
  - href: https://www.figma.com/design/QgmoT5Uuvv3elB96F4nsTq/Nation-Design-System?node-id=7121-7243
    rel: design
    role: Figma page 23 Progress Bars

traits:
  - traitType: variant
    kind: enum
    id: size
    description: Thickness, gaps and the text style of the number. Default md. The same 5 steps as the two rings.
    values:
      - id: md
        description: 8 thick. The default for general back-office screens.
      - id: xs
        description: 4 thick. A thin bar in a table row or a small card with little height.
      - id: sm
        description: 6 thick. Forms and crowded panels.
      - id: lg
        description: 10 thick. Screens where the bar must be seen at once, such as a large file upload.
      - id: xl
        description: 12 thick. Large screens read from a distance.
  - traitType: variant
    kind: enum
    id: labelPosition
    description: Where the number sits. Figma axis label-position. Default right.
    values:
      - id: right
        description: Right of the bar. The bar takes the rest of the width. The default.
      - id: bottom
        description: Under the bar at the right end. For a space so narrow the bar would be too short.
  - traitType: variant
    kind: boolean
    id: showLabel
    description: Shows the number. Figma property show-label. Default true. The number is never shown while indeterminate.
  - traitType: state
    kind: boolean
    id: indeterminate
    description: >-
      Not a prop. It is on whenever value is left out. Figma property indeterminate. The fill slides in a loop, the number is
      hidden, and aria-valuenow, aria-valuemin, aria-valuemax and aria-valuetext are removed.
  # NEEDS CLARIFICATION: the Figma property indeterminate on progress-bar (and circular-progress-bar) is not wired to any layer, so turning it on changes nothing on the canvas. How should a designer show the indeterminate look?

$extensions:
  com.nationgroup:
    figmaPage: "23 Progress Bars"
    figmaSets: [progress-bar]
