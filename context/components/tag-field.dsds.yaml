# TagField in DSDS 0.23 format https://designsystemdocspec.org
# Facts come from components/TagField/ (no README yet), docs/13-input.md, docs/21-tags.md, tokens/scale/input.mjs,
# tokens/figma-components.json, tokens/figma-layers/tag-field.json and the Figma page 13 Input (read 2026-10-27)
# Page 21 Tags has no tag-field set. The tags inside the field are semi-rounded-tag instances from that page.
# Levels go in this order: must, should, may, should-not, must-not
# Sections go from broad to narrow: when-to-use before how-to-use, for: all before for: agent
# The first value of every enum trait is its default

kind: component
id: tag-field
name: TagField
description: >-
  A field that holds several values as tags. The user types a value and presses Enter or the add button to add it,
  and removes one with a tag's close button or with Backspace in an empty field. The field grows taller as tags wrap.
  It matches the Figma set tag-field on page 13 Input and was split out of TextField on 2026-10-27, so it is experimental.
  It exists so forms that take several typed values, such as keywords or news categories, use one field with the
  same sizes, states and error display as TextField.

metadata:
  owner: Nation Design System team
  updated: {date: 2026-10-27}
  tags: [input, form]
  status: {status: experimental}
  aliases: [tag-field]

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: should
        statement: >-
          Use when the user types several free values and each one shows as a tag, such as search keywords or
          news categories.
        checkedBy: manual
      - level: must-not
        statement: >-
          Use TagField when the values must come from a fixed list, such as provinces. Use Checkbox to pick several
          values from a fixed list, or Dropdown to pick one.
        alternatives:
          - to: checkbox
          - to: dropdown
        checkedBy: manual
      # NEEDS CLARIFICATION: Storybook sends a fixed list to Dropdown or Checkbox, but dropdown.dsds.yaml says Dropdown has no multi-select in code. For several values from a long fixed list, what should be used?
      - level: must-not
        statement: >-
          Build a tag field from TextField with Tag inside. Use TagField, which was split out of TextField on 2026-10-27
          for this.
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: >-
          Always pass label. Never use placeholder in place of the label. Its default is เพิ่ม.
          A placeholder disappears once the user types, and screen readers don't treat it as a label.
        checkedBy: manual
      - level: must
        statement: Pass help text and error text in the hint prop. Don't render it as a separate element under the field.
        checkedBy: manual
      - level: must
        statement: >-
          IF you pass tags THEN also pass onTagsChange and feed the new list back into tags. With tags set the field
          doesn't keep its own list, so without onTagsChange nothing can be added or removed. ELSE use defaultTags.
        checkedBy: manual
      - level: must
        statement: >-
          Set error, disabled and readOnly only with their props. Hover and focus come from CSS.
          Don't pass a state prop or add state classes.
        checkedBy: manual
      - level: should
        statement: >-
          IF maxTags is set THEN state the limit in hint, such as ไม่เกิน 5 คำ. At the limit Enter and the add button
          add nothing, and the field doesn't say why.
        checkedBy: manual
      - level: must-not
        statement: >-
          Set a fixed height on the field. It grows with the number of tags, and the declared height is the minimum.
          The padding is (field height minus tag height) divided by two, so one row of tags is as tall as a Button.
        checkedBy: manual
      - level: must-not
        statement: >-
          Change the size, family or hierarchy of the tags in the field, or the field padding, gap or radius, with
          className or style. The tags are always Tag neutral secondary at the same size name as the field.
          A larger tag makes the field taller than a Button of the same size.
        checkedBy: manual
      - level: must-not
        statement: >-
          Use the TextField padding or gap tokens for TagField, or the other way round, even where the values happen to match.
          TagField has its own tokens, such as --ntg-input-tag-padding-top-md and --ntg-input-tag-gap-md.
        checkedBy: manual
      - level: must-not
        statement: >-
          Put tags the user must read or copy into a disabled field. Use readOnly. A disabled value is not submitted
          and screen readers often skip it.
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - refs:
          - to: shared-a11y#focus-visible
            rel: same-as
      - refs:
          - to: shared-a11y#text-contrast
            rel: same-as
      - refs:
          - to: shared-a11y#color-not-only
            rel: same-as
      - refs:
          - to: shared-a11y#icon-name
            rel: same-as
      - level: must
        statement: >-
          Tie the label to the input. The label prop does this with a label element whose for matches the input id.
          Text placed next to the field is not enough.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
            role: WCAG 2.2 SC 1.3.1 (A)
        checkedBy: manual
      - level: must
        statement: >-
          Tie help and error text to the input with aria-describedby. The hint prop does this. A caller's own
          aria-describedby prop replaces that link, so don't pass both.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
            role: WCAG 2.2 SC 1.3.1 (A)
        checkedBy: manual
      - level: must
        statement: >-
          When error is true, set hint to text that says how to fix the value, such as เลือกได้ไม่เกิน 3 หมวด,
          not only that it is wrong. The red color alone fails WCAG (failure technique F81).
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html
            role: WCAG 2.2 SC 3.3.1 (A)
        checkedBy: manual
      - level: must
        statement: >-
          IF showAddButton is true THEN keep addLabel a non-empty name, default เพิ่ม. The add button shows only an icon,
          and addLabel is its only name.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
            role: WCAG 2.2 SC 4.1.2 (A)
        checkedBy: manual
      - level: should
        statement: >-
          Keep the tag text in removeLabel. The default is ลบ followed by the tag, so each close button says which tag
          it removes.
        checkedBy: manual
      # NEEDS CLARIFICATION: nothing tells a screen reader user that a tag was added, removed, skipped as a duplicate or refused at maxTags. TagField has no live region and no source has a rule. Is an announcement required?

  - kind: guidelines
    for: agent
    items:
      - level: must
        statement: >-
          IF the tags are correct but the user can't change them and still needs to read them THEN use readOnly.
          IF the field can't be used at the moment THEN use disabled. Both hide the tags' close buttons and turn off
          the add button.
        checkedBy: assisted
      - level: must
        statement: IF the number of values is limited THEN set maxTags and state the limit in hint.
        checkedBy: assisted
      - level: should
        statement: >-
          IF the field sits in a table filter row or a dense toolbar THEN use size sm. IF the form is designed for mobile
          THEN use size lg. ELSE use size md.
        checkedBy: assisted
      - level: should
        statement: >-
          IF a TagField sits in one row with a Button or a TextField THEN give them the same size (sm, md or lg).
          With one row of tags the field is 32, 40 or 48 high, like the others.
        checkedBy: assisted
      # NEEDS CLARIFICATION: required draws an asterisk and sets aria-required on the input, but the Figma set tag-field has no required property and no asterisk (TagField.base.css says so). Is a required tag field part of the design, and what counts as filled, one tag or typed text?

  - kind: definitions
    for: all
    context: anatomy
    items:
      - term: Stack
        definition: The root. A vertical stack of label row, box and hint, with --ntg-input-stack-gap between them.
      - term: Label row
        definition: >-
          Shown when label is set. A label element tied to the input, followed by an asterisk when required is true
          (aria-hidden, gap --ntg-input-label-gap). Text style body/sm. Color at rest, disabled and read-only is
          --ntg-color-text-general-section-heading, hover --ntg-color-text-general-label, focused --ntg-color-text-brand-primary,
          error and error-focused --ntg-color-text-system-error, error-hover --ntg-color-text-system-error-hover.
          The same colors as TextField.
      - term: Box
        definition: >-
          Padding on all four sides is --ntg-input-tag-padding-<side>-<size> (5, 7, 9), worked out in tokens/scale/input.mjs
          as (field height 32, 40, 48 minus tag height 22, 26, 30) divided by two. The gap between the tag area, divider and
          add button is --ntg-input-tag-gap-<size> (5, 7, 9). Corner radius --ntg-input-radius-<corner>-<size>, border 1px
          drawn as an inset box-shadow. In Figma the minimum height is bound to input/height/<size>.
      - term: Fill, border and effect
        definition: >-
          Fill: default and focused --ntg-color-background-general-primary, hover --ntg-color-background-general-primary-hover,
          read-only --ntg-color-background-general-secondary, disabled --ntg-color-background-general-disabled-subtle.
          Border: default --ntg-color-border-general-primary, hover --ntg-color-border-general-primary-hover,
          focused --ntg-color-border-brand-solid, disabled --ntg-color-border-general-disabled-subtle,
          read-only --ntg-color-border-general-secondary, error --ntg-color-system-error, error-hover
          --ntg-color-system-error-hover, error-focused --ntg-color-border-system-error-solid. Hover and error-hover add
          --ntg-shadows-bottom-xs, focused adds --ntg-focused-ring-brand, error-focused adds --ntg-focused-ring-error.
          Focus is taken from :focus-visible on the input.
      - term: Tag area
        definition: >-
          Holds the tags and the input and wraps onto new lines, with --ntg-input-tag-tag-gap-<size> (4, 8, 8) between tags
          in both directions. Figma draws one row with tag-1 to tag-5, of which 3 to 5 are hidden.
      - term: Tags
        definition: >-
          One Tag per value, family neutral, hierarchy secondary, at the same size name as the field (Figma semi-rounded-tag).
          The close button shows unless disabled or readOnly, and its name is removeLabel(tag), default ลบ followed by the tag.
      - term: Input
        definition: >-
          Always present in code, where new values are typed (the Figma property show-input-text can hide it).
          Text style body/xs at size sm and body/sm at md and lg. Placeholder color --ntg-color-text-general-placeholder,
          disabled text --ntg-color-text-general-disabled-subtle. Enter adds the trimmed text, and empty text adds nothing.
          A value already in the list is not added again and the typed text is cleared. Backspace in an empty input removes
          the last tag.
      - term: Divider
        definition: >-
          A line between the tag area and the add button, aria-hidden, width --ntg-divider-thickness, in the box border color.
          It stretches to the box height and never has a fixed height. Figma uses a vertical-divider instance.
          Not drawn when showAddButton is false.
      - term: Add button
        definition: >-
          An icon-only LinkButton, family neutral, icon add, named by addLabel (default เพิ่ม). Its size is xs, md or lg for
          a field of size sm, md or lg, the same as the Figma link-icon-button instance. Turned off while disabled or readOnly.
          It is an add button, not a clear button.
      - term: Hint
        definition: >-
          Shown when hint is set. Tied to the input with aria-describedby. Text style body/sm, color
          --ntg-color-text-general-text, and --ntg-color-text-system-error when error is true.
      # NEEDS CLARIFICATION: Figma binds the minimum height of the box to input/height/<size>, and docs/13-input.md section 4.6 says the same, but TagField.base.css and the generated TagField.module.css set no min-height, so an empty field relies on the input and add button to reach 32, 40 or 48. Should the code bind --ntg-input-height-<size> as min-height?
      # NEEDS CLARIFICATION: in the Figma disabled variants the tags stay state=default, but TagField.tsx passes disabled to each Tag, which gives the Tag disabled look. Which look is right for tags in a disabled field?

uses:
  - to: tag
  - to: link-button

alternatives:
  - to: text-field
  - to: checkbox

refs:
  - href: ../../components/TagField/TagField.tsx
    rel: source
    role: Import TagField from components/TagField
  - href: ../../components/TagField/TagField.stories.tsx
    rel: demo
    role: Storybook stories (npm run storybook)
  - href: ../../docs/13-input.md
    rel: relates-to
    role: Thai page doc for Figma page 13 Input, which holds the tag-field set
  - href: ../../docs/21-tags.md
    rel: relates-to
    role: Thai page doc for Figma page 21 Tags, where the tag height that sets the field padding lives
  - href: https://www.figma.com/design/QgmoT5Uuvv3elB96F4nsTq/Nation-Design-System?node-id=7121-7233
    rel: design
    role: Figma page 13 Input

traits:
  - traitType: variant
    kind: enum
    id: size
    description: >-
      Box padding, gaps, radius, the tag size and the add button size. The first value is the default.
      Only 3 sizes, like TextField.
    values:
      - id: md
        description: 40 high with one row of tags, tags md. General forms. The default.
      - id: sm
        description: 32 high with one row of tags, tags sm. Table filter rows and dense toolbars.
      - id: lg
        description: 48 high with one row of tags, tags lg. Forms designed for mobile.
  - traitType: variant
    kind: boolean
    id: required
    description: >-
      Shows an asterisk after the label, hidden from screen readers, and sets aria-required on the input. Default false.
      Code only, the Figma set has no required property.
  - traitType: variant
    kind: boolean
    id: showAddButton
    description: Shows the divider and the add button at the end of the box. Default true. Enter still adds without it. Code only.
  - traitType: state
    kind: boolean
    id: error
    description: >-
      Error border and label color, red hint, and aria-invalid on the input. Covers the Figma states error,
      error-hover and error-focused. Default false.
  - traitType: state
    kind: boolean
    id: disabled
    description: >-
      The native disabled attribute on the input. Uses the disabled tokens, hides the tags' close buttons and turns off
      the add button. Nothing can be typed, added or removed.
  - traitType: state
    kind: boolean
    id: readOnly
    description: >-
      The native readOnly attribute on the input. Figma state read-only. The tags stay readable, the close buttons are hidden
      and the add button is turned off.

$extensions:
  com.nationgroup:
    figmaPage: "13 Input"
    figmaSets: [tag-field]
