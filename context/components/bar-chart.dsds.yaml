# BarChart in DSDS 0.23 format https://designsystemdocspec.org
# Facts come from components/BarChart/ (BarChart.tsx, BarChart.module.css, README.md, BarChart.stories.tsx),
# docs/research/chart-component.md section 9, tokens/scale/chart.mjs
# and the Figma page 29 Chart (bar-chart 11797:2, _bar-chart-bar 11796:5, read 2026-10-28, bar and line combo with
# the hover state added the same day)
# Levels go in this order: must, should, may, should-not, must-not
# The first value of every enum trait is its default

kind: component
id: bar-chart
name: BarChart
description: >-
  A vertical grouped bar chart with a y axis on the left and an optional y axis on the right, one group of bars per
  category and one bar per bar series, with an optional line series drawn over the bars. Hovering or focusing a category
  shows a band and a tooltip with the full numbers, and a button swaps the chart for a data table. It matches the Figma component bar-chart on page 29 Chart, first used on the
  One CMS dashboard. It exists so every dashboard draws bars, grid lines, axis labels and the legend with the same
  tokens and gives screen readers the same summary and data table.

metadata:
  owner: Nation Design System team
  updated: {date: 2026-10-28}
  tags: [data-display, chart]
  status: {status: beta}
  aliases: [bar-chart, _bar-chart-bar, combo chart, bar and line chart]

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: should
        statement: >-
          Use to compare one or two numbers across a list of categories, such as news created and page views for each
          day of a month.
        checkedBy: manual
      - level: must-not
        statement: >-
          Use for a single value against a ceiling, such as sales against target. Use a progress component instead.
        alternatives:
          - to: semi-circular-progress-bar
          - to: progress-bar
        checkedBy: manual
      - level: must-not
        statement: >-
          Pass more than 2 bar series or more than 1 line series. Only 2 bar colors and 1 line color exist, and extra
          series are not drawn.
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: >-
          Always pass summary, one sentence that states what the chart shows and its main finding.
          It becomes the name of the figure (a visually hidden figcaption) and the caption of both data tables.
        checkedBy: manual
      - level: must
        statement: >-
          IF the two series have different units, such as a count of news and a count of views, THEN put each on its own
          axis with axis left and axis right ELSE put both on the left axis and leave the right axis off.
        checkedBy: manual
      - level: should
        statement: >-
          Pass unit on every series, such as ข่าว or ครั้ง, and pass categoryLabel, such as วันที่. The tooltip, the name
          of each category and the table headers are built from them, for example วันที่ 10 ข่าวที่สร้าง 28 ข่าว.
        checkedBy: manual
      - level: should
        statement: >-
          IF one series is a total that changes slowly and the other is a count of events, such as page views and news
          created, THEN draw the total as type line on its own axis and keep the count as bars.
        checkedBy: manual
      - level: must-not
        statement: >-
          Set showRightAxis to false while a series uses axis right. That series would have no scale to read.
        checkedBy: manual
      - level: must-not
        statement: >-
          Set a width on the chart. It always fills its parent. To make it narrower, limit the parent.
        checkedBy: manual
      - level: must-not
        statement: >-
          Change bar, grid or text colors, spacing or the bar radius with className or style. They come from the chart
          and space tokens.
        checkedBy: manual
      # NEEDS CLARIFICATION: the research (section 9 item 5) suggests a minimum height of 2 for a bar whose value is not 0, as Polaris does. The code does not do this yet. Should it?

  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - refs:
          - to: shared-a11y#text-contrast
            rel: same-as
      - refs:
          - to: shared-a11y#color-not-only
            rel: same-as
      - level: must
        statement: >-
          Keep the hidden data table while the chart shows. It shows full numbers such as 240,000. Pass categoryLabel so
          its first column has a real header, such as วันที่. When the table toggle is on, the visible Table replaces it.
        evidence:
          - href: https://www.w3.org/WAI/tutorials/images/complex/
            role: W3C WAI Complex Images tutorial
        checkedBy: manual
      - level: must
        statement: >-
          The plot is a role group with a single tab stop (roving tabindex) across the category slots. Left and Right
          arrows move one category, Home and End jump to the first and last, and Escape hides the tooltip. Each slot has
          role img and a name with the full data, such as วันที่ 10 ข่าวที่สร้าง 28 ข่าว การเข้าชม 126,353 ครั้ง, so the
          Tooltip uses relationship inaccessible and is not read twice. The figure is not role img, because role img
          hides every child from assistive tech.
        evidence:
          - href: https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/#kbd_roving_tabindex
            role: WAI-ARIA APG roving tabindex
        checkedBy: manual
      - level: must
        statement: >-
          The focused slot shows the hover band with the focus ring --ntg-focused-ring-brand, so focus is always visible.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
            role: WCAG 2.2 SC 2.4.7 (AA)
        checkedBy: manual
      - level: must
        statement: >-
          Keep the 1px border on the light bars and the light legend dot. The light fill alone has a contrast of 1.46 to 1
          on white, and the border brings it to 3 to 1.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html
            role: WCAG 2.2 SC 1.4.11 (AA)
        checkedBy: manual

      - level: may
        statement: >-
          Exception to the Tooltip spec, which says not to put needed information in a tooltip because touch screens
          never show it. The full numbers in this tooltip are also in the table behind the toggle button and in the
          hidden table, so the tooltip is a shortcut, not the only way to the data. Keep showTableToggle on where touch
          users need exact numbers.
        checkedBy: manual
        refs:
          - to: tooltip
            rel: relates-to
  - kind: guidelines
    for: agent
    items:
      - level: must
        statement: >-
          IF the data has more than 2 bar series or more than 1 line series THEN ask for a new series color token before
          building ELSE use BarChart.
        checkedBy: assisted
      - level: should
        statement: >-
          IF the surrounding card title already names what each color means THEN set showLegend to false ELSE keep it on.
          IF there are two axes THEN keep the legend on, because it is the title of each axis.
        checkedBy: assisted

  - kind: definitions
    for: all
    context: anatomy
    items:
      - term: Root
        definition: >-
          A figure that fills the parent width, named by a visually hidden figcaption with summary. Inside, the legend
          row and the plot (or the visible table) with a gap of --ntg-size-space-s2-sm (16). Beside it is the hidden data
          table.
      - term: Legend
        definition: >-
          A row with a gap of --ntg-size-space-s2-sm (16). Left are the series on the left axis, right are the series on
          the right axis, then the table toggle at the end. A bar series item is a dot of --ntg-size-space-s2-xs (12);
          a line series item is a short line, a point and a short line (--ntg-size-space-s1-sm 4, --ntg-chart-point-size 8,
          4, line --ntg-chart-line-width 2 thick). Label gap --ntg-size-space-s1-lg (8), text preset meta/caption, color
          --ntg-chart-color-axis-text. Figma property show-legend.
      - term: Table toggle
        definition: >-
          A Button family neutral, hierarchy secondary, size sm, with aria-pressed, labelled ดูเป็นตาราง or ดูเป็นกราฟ. It
          sits at the end of the legend row, or on its own row when the legend is off. On, the plot is replaced by a Table
          with categoryLabel as the row header column and one number column per series, header label plus unit in
          brackets, full numbers, aligned to the start per the Table rules. Prop showTableToggle, default true.
      - term: Y axis labels
        definition: >-
          A column --ntg-size-space-s3-md (48) wide on each side, gap --ntg-size-space-s1-lg (8) to the plot, 5 labels
          spaced between top and bottom, right aligned on the left and left aligned on the right. Text preset meta/caption,
          color --ntg-chart-color-axis-text. Labels use Intl.NumberFormat th-TH compact (240K) unless formatValue is passed.
          The right column shows only with showRightAxis (Figma show-right-axis).
      - term: Grid
        definition: >-
          5 horizontal lines 1px thick in --ntg-chart-color-grid, spaced between top and bottom with an inset of
          --ntg-size-space-s1-xl (10), so each line sits at the middle of its y label. Ticks are 4 intervals on both axes,
          step niceCeil(max / 4) from 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8 times a power of ten, starting at 0.
      - term: Bar group
        definition: >-
          Each category slot is --ntg-size-space-s2-xl (28) wide. Slots are spaced between with padding
          --ntg-size-space-s1-xl (10) top and bottom and --ntg-size-space-s2-xs (12) left and right, and stand on the
          bottom grid line. Bars are centered in the slot: one bar series gives one 12 wide bar, two give two bars
          --ntg-size-space-s1-sm (4) apart. Only bar series take room in the slot. A slot is never wider than 0.7 of the
          space per category, so bars get thinner on narrow screens.
      - term: Bar
        definition: >-
          --ntg-size-space-s2-xs (12) wide at full size. Top corners --ntg-chart-radius-top-left and
          --ntg-chart-radius-top-right (2), bottom corners square. Series 1 fill --ntg-chart-color-series-1.
          Series 2 fill --ntg-chart-color-series-2 with a 1px inside border --ntg-chart-color-series-2-border.
          Height is the value as a percent of the top tick. A value of 0 draws nothing.
      - term: Line and points
        definition: >-
          One point per category at the slot center, at the value's height on the line series' own axis: a circle
          --ntg-chart-point-size (8), fill --ntg-chart-color-point-fill, border --ntg-chart-line-width in
          --ntg-chart-color-line. An SVG polyline without viewBox joins the points, stroke --ntg-chart-color-line, width
          --ntg-chart-line-width, round joins and caps. Layers from the bottom are grid, hover band, bars, line, points.
          Points render on the server with CSS; the line appears after mount, once the point positions are measured.
      - term: Hover band and tooltip
        definition: >-
          Hovering anywhere in a category slot (full plot height) or focusing it shows a band --ntg-size-space-s3-sm (40)
          wide, full plot height, --ntg-chart-color-hover, centered on the category, behind bars and line, and a Tooltip
          size sm above the highest of the bar top and the point. Placement is top, or top-start and top-end for the
          categories so close to an edge that a centered tooltip would leave the chart. Title is categoryLabel and the
          category, such as วันที่ 10; description is one entry per series, label, full number and unit, newline
          separated. The chart has one Tooltip that moves to the slot under the pointer or with keyboard focus, and it
          opens and closes at once with no delay, so a fast sweep across the bars never stacks tooltips (user decision
          2026-11-12, replacing one Tooltip per slot). Figma property show-tooltip is a design-only preview of this state
          and has no prop.
      - term: X axis labels
        definition: >-
          One label per group, as wide as the group and centered under it, text preset meta/caption, color
          --ntg-chart-color-axis-text. With a slot under 24px only labels 1, 5, 10, 15, 20, 25 and 30 show.
          With a slot under 14px the plot and x labels scroll sideways while the y axes stay in place.
      - term: Data table
        definition: >-
          A real table, visually hidden, with summary as its caption, categoryLabel and the series labels (with unit) as
          column headers, and full numbers formatted with Intl.NumberFormat th-TH. Rendered while the chart shows.

alternatives:
  - to: table
  - to: progress-bar
  - to: semi-circular-progress-bar

refs:
  - href: ../../components/BarChart/BarChart.tsx
    rel: source
    role: Import BarChart from components/BarChart
  - href: ../../components/BarChart/README.md
    rel: relates-to
    role: Thai README with the props table
  - href: ../../components/BarChart/BarChart.stories.tsx
    rel: demo
    role: Storybook stories (npm run storybook)
  - href: ../../docs/research/chart-component.md
    rel: relates-to
    role: Research on chart components with the decisions in section 9
  - href: https://www.figma.com/design/QgmoT5Uuvv3elB96F4nsTq/Nation-Design-System?node-id=11793-2
    rel: design
    role: Figma page 29 Chart

traits:
  - traitType: variant
    kind: boolean
    id: showLegend
    description: Shows the legend above the plot. Figma property show-legend. Default true.
  - traitType: variant
    kind: boolean
    id: showRightAxis
    description: >-
      Shows the right y axis labels and the right legend. Figma property show-right-axis. Default true when any series
      uses axis right.
  - traitType: variant
    kind: boolean
    id: showTableToggle
    description: >-
      Shows the ดูเป็นตาราง button that swaps the chart for a visible Table. No Figma property. Default true.

$extensions:
  com.nationgroup:
    figmaPage: "29 Chart"
    figmaSets: [bar-chart]
