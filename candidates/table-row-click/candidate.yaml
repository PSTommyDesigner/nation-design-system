name: table-row-click
thaiName: ตารางกดได้ทั้งแถว
requestedBy: ATS
status: proposed
submitted: 2026-11-27
expires: 2026-12-27
problem: >-
  ทุกตารางใน ATS เปิดหน้าถัดไปจากแถว คือรายการฝ่ายหน้า 1 รายการแอปหน้า 2 และหน้า 3
  รายการผู้ใช้หน้า 5 และตารางใน Modal ของกล่องตัวเลขทั้ง 5 กล่อง
  Table ของระบบไม่มี prop ให้กดทั้งแถว จึงต้องวาง LinkButton ในคอลัมน์แรก
  ผู้ใช้ต้องเล็งกดที่ตัวอักษรซึ่งกดยาก โดยเฉพาะบนมือถือ (ผู้ใช้ทัก 27 พ.ย. 2569)
  ขอเป็น onRowClick(row) ที่ทำให้ทั้งแถวกดได้จริงด้วยเมาส์และคีย์บอร์ด
  คู่กับ getRowClickLabel(row) สำหรับโปรแกรมอ่านหน้าจอ
triedInstead: LinkButton ในเซลกดได้เฉพาะตัวอักษรและข้อความที่ตัดบรรทัดจัดกลางไม่ชิดซ้าย · selectable เป็นช่องติ๊กเลือกแถว ไม่ใช่การเปิดหน้า · แต่ง Table จากภายนอกผิดกฎ components/AGENTS.md
figma: ยังไม่มีเฟรมใน Figma ของ ntgds หน้า 28 Table ดูของจริงจาก prototype ของ ATS
pr:
notes: เป็นการเพิ่มความสามารถให้ Table ที่มีอยู่แล้ว ไม่ใช่ component ใหม่ ถ้ารับน่าจะจบที่สถานะ merged · ต้องตัดสินด้วยว่าเมื่อทั้งแถวกดได้แล้ว คอลัมน์แรกยังควรเป็นลิงก์ซ้อนอยู่ข้างในหรือเป็นข้อความธรรมดา
