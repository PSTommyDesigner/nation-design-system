# ด่านตรวจ component candidate (ดู candidates/_template.candidate.yaml และหน้า Candidates ใน Storybook)
#
# ทำ 2 อย่าง
# 1. Pull Request หรือ push ที่แตะ candidates/ ตรวจว่าไฟล์ตรงแม่แบบ ชนิดข้อมูลผ่าน
#    และ Pull Request ของ candidate ห้ามแตะไฟล์นอก candidates/ (กันข้อเสนอปนงานอื่น)
# 2. ทุกเช้าวันจันทร์ ตรวจตัวที่เลยวันหมดอายุ ถ้ามี เปิดหรืออัปเดต issue ให้ทีม Design System ตัดสิน
#    ใช้ issue เพราะยังไม่ได้ตกลงห้องแชทของทีม ถ้าตกลงแล้วค่อยต่อแจ้งเตือนจาก issue ไปห้องนั้น
name: Candidate checks

on:
  pull_request:
    paths: ['candidates/**']
  push:
    branches: [main]
    paths: ['candidates/**']
  schedule:
    - cron: '0 2 * * 1' # จันทร์ 09:00 เวลาไทย
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: เช็คเอาท์โค้ด
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Request ของ candidate ต้องแตะเฉพาะ candidates/
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          OUTSIDE=$(git diff --name-only "$BASE" "$HEAD" | grep -v '^candidates/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "✗ Pull Request ของ candidate แตะไฟล์นอก candidates/ แยกไปอีก Pull Request"
            echo "$OUTSIDE"
            exit 1
          fi

      - name: ตั้งค่า Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependency
        run: npm ci

      - name: ตรวจไฟล์ candidate ตามแม่แบบ
        run: node scripts/check-candidates.mjs

      - name: ตรวจชนิดข้อมูล (คุม story ของ candidate ด้วย)
        run: npm run typecheck

  expired:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: เช็คเอาท์โค้ด
        uses: actions/checkout@v4

      - name: หา candidate ที่เลยวันหมดอายุ
        id: expired
        run: |
          set +e
          OUT=$(node scripts/check-candidates.mjs --expired 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "report<<REPORT"
            echo "$OUT"
            echo "REPORT"
          } >> "$GITHUB_OUTPUT"
          echo "found=$([ $CODE -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: เปิดหรืออัปเดต issue แจ้งทีม Design System
        if: steps.expired.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.expired.outputs.report }}
        run: |
          TITLE="Candidate เลยวันหมดอายุ รอทีม Design System ตัดสิน"
          BODY=$(printf 'รอบเตือนรายสัปดาห์พบ candidate สถานะ proposed ที่เลยวันหมดอายุ\nตัดสินใน candidate.yaml ของแต่ละตัว (รับ รวมกับตัวเดิม หรือไม่รับ) หรือเลื่อน expires พร้อมเหตุผล\n\n```\n%s\n```' "$REPORT")
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
